name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the scoring service
        working-directory: services/ml
        run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'

      # Throwaway secrets for this run only; nothing real is stored in the repo.
      - name: Create env files
        run: pnpm setup:env
      - name: Start Postgres and Redis
        run: pnpm db:up
      - name: Apply migrations
        run: pnpm db:migrate

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Seed (also checks the data against the designs)
        run: pnpm db:seed
      - name: API end-to-end tests
        run: pnpm --filter @kora/api test:e2e
      - name: Install browser
        run: pnpm --filter @kora/web exec playwright install --with-deps chromium
      - name: Console end-to-end tests
        run: pnpm --filter @kora/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/e2e/.results
          retention-days: 7

  ml:
    name: ML service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
