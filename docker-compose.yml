# Local development services. Host ports are offset (5433, 6380) so they
# don't clash with a Postgres or Redis already running on the machine.
name: kora-lend
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kora
      POSTGRES_PASSWORD: kora_dev_only
      POSTGRES_DB: kora_lend
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kora -d kora_lend']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
