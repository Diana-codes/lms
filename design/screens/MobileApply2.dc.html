<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply — your details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0E3B2E}a:hover{color:#08261D}
input:focus,select:focus{outline:2px solid #0E3B2E;outline-offset:1px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F1; font-family: Inter, system-ui, sans-serif; color: #121614; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 20px 20px 0; display: flex; align-items: center; gap: 12px">
    <a href="MobileApply.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E1E4DD; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121614" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #5B635E">Step 2 of 3 · Your details</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
        <span style="height: 4px; border-radius: 99px; background: #0E3B2E"></span>
        <span style="height: 4px; border-radius: 99px; background: #0E3B2E"></span>
        <span style="height: 4px; border-radius: 99px; background: #DADDD5"></span>
      </div>
    </div>
  </header>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 22px 20px 8px; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15">Tell us about your business</h1>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <span id="purpose-label" style="font-size: 13px; font-weight: 600">What is the loan for?</span>
      <div role="group" aria-labelledby="purpose-label" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{purposes}}" as="p" hint-placeholder-count="5">
          <button aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
        </sc-for>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E1E4DD; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B635E">Business name
        <input type="text" value="Uwase Tailoring" style="font: inherit; font-size: 15px; color: #121614; height: 46px; border: 1px solid #D5D9D0; border-radius: 12px; padding: 0 12px; box-sizing: border-box"></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B635E">Sector
        <select style="font: inherit; font-size: 15px; color: #121614; height: 46px; border: 1px solid #D5D9D0; border-radius: 12px; padding: 0 10px; background: #FFFFFF">
          <option>Garments &amp; tailoring</option><option>Retail shop</option><option>Agriculture</option><option>Transport</option><option>Other</option>
        </select></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B635E">Average monthly revenue (RWF)
        <input type="text" inputmode="numeric" value="1,650,000" style="font: inherit; font-size: 15px; color: #121614; height: 46px; border: 1px solid #D5D9D0; border-radius: 12px; padding: 0 12px; box-sizing: border-box; font-variant-numeric: tabular-nums"></label>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E1E4DD; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; margin-right: auto">Identity</span>
        <span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #E2F5C4; color: #2E4A05; display: flex; align-items: center; gap: 4px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>Verified with NIDA</span>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5B635E">National ID number
        <input type="text" inputmode="numeric" value="1 1990 8 •••••••• 41" style="font: inherit; font-size: 15px; color: #121614; height: 46px; border: 1px solid #D5D9D0; border-radius: 12px; padding: 0 12px; box-sizing: border-box; letter-spacing: 0.04em"></label>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button style="height: 88px; border-radius: 14px; border: 1px solid #A9D61C; background: #F2F8E3; font: inherit; font-size: 12px; color: #2E4A05; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2.5"/><path d="M13 10h5M13 14h3"/></svg>ID front · added</button>
        <button onClick="{{takeSelfie}}" style="{{selfieStyle}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>{{selfieLabel}}</button>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E1E4DD; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 600">Statements</span>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #FFF4D6; display: flex; align-items: center; justify-content: center; flex: none; font-size: 11px; font-weight: 700; color: #6B4A00">MoMo</span>
        <div style="display: flex; flex-direction: column; margin-right: auto"><span style="font-size: 14px; font-weight: 500">Share 6 months of MoMo history</span><span style="font-size: 12px; color: #5B635E">Faster decision, no upload needed</span></div>
        <button role="switch" aria-checked="{{share}}" aria-label="Share MoMo history" onClick="{{toggleShare}}" style="{{switchStyle}}"><span style="{{knobStyle}}"></span></button>
      </div>
    </section>
  </div>

  <div style="padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 8px; background: #F4F5F1; border-top: 1px solid #E8EAE4">
    <a href="MobileApply3.dc.html" style="height: 54px; border-radius: 16px; background: #121614; color: #FFFFFF; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Review application</a>
    <span style="font-size: 12px; color: #5B635E; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Your data is encrypted and only used for this application</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { purpose: 'Equipment', share: true, selfie: false };
  }
  renderVals() {
    var self = this;
    var purposes = ['Stock', 'Equipment', 'Expand shop', 'School fees', 'Other'].map(function (label) {
      var on = self.state.purpose === label;
      return {
        label: label,
        pressed: on ? 'true' : 'false',
        style: 'height: 44px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; ' + (on ? 'border: 2px solid #0E3B2E; background: #E2F5C4; color: #0E3B2E; font-weight: 600' : 'border: 1px solid #D5D9D0; background: #FFFFFF; color: #121614'),
        pick: function () { self.setState({ purpose: label }); }
      };
    });
    var on = this.state.share;
    return {
      purposes: purposes,
      takeSelfie: function () { self.setState({ selfie: true }); },
      selfieLabel: this.state.selfie ? 'Selfie · matches ID' : 'Take a selfie',
      selfieStyle: 'height: 88px; border-radius: 14px; font: inherit; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; ' + (this.state.selfie ? 'border: 1px solid #A9D61C; background: #F2F8E3; color: #2E4A05' : 'border: 1.5px dashed #A7ADA3; background: #FFFFFF; color: #3B423E'),
      share: on ? 'true' : 'false',
      toggleShare: function () { self.setState({ share: !self.state.share }); },
      switchStyle: 'width: 52px; height: 32px; border-radius: 999px; border: 0; padding: 3px; cursor: pointer; flex: none; display: flex; ' + (on ? 'background: #0E3B2E; justify-content: flex-end' : 'background: #C9CEC5; justify-content: flex-start'),
      knobStyle: 'width: 26px; height: 26px; border-radius: 50%; display: block; ' + (on ? 'background: #C6F432' : 'background: #FFFFFF')
    };
  }
}
</script>
</body>
</html>
